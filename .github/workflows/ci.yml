name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-build:
    name: typecheck + frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      # Tauri 是 macOS 原生 app：Linux runner 上跑 `tauri build` 会缺
      # libwebkit2gtk 等系统依赖，且 bundle targets（dmg/app）是 macOS 专属。
      # 这里只验前端（vite build），完整打包由 release.yml 在 macOS 上验。
      - name: Build frontend
        run: pnpm --filter @navi/desktop build:vite
