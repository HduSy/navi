name: Release

# Push a version tag (e.g. v0.3.1) to build the app and publish a GitHub Release.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release:
    # Only build/publish for version tags. workflow_dispatch from a branch would
    # otherwise set the version/tag to the branch name and publish a malformed
    # release (e.g. tagged "main").
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    strategy:
      # One platform's failure must not cancel the other — a broken Windows
      # bundler shouldn't block the macOS .dmg from publishing (and vice versa).
      fail-fast: false
      matrix:
        include:
          # macos-latest = arm64 (Apple Silicon)，与本地产物一致（aarch64 dmg/app），
          # 原生编译 rusqlite，无需交叉编译
          - os: macos-latest
            target: aarch64-apple-darwin
            rust-targets: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            rust-targets: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "apps/desktop/src-tauri -> target"

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Build & publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # --- Code signing + notarization (optional) ---
          # UNSIGNED BUILD BY DEFAULT (macOS + Windows). Do NOT set these until
          # the matching secrets actually exist — tauri's bundler treats an empty
          # APPLE_CERTIFICATE env var as "a certificate is present" and then
          # fails on `security import`.
          #
          # Once you have signing credentials, add these in repo
          # Settings → Secrets and uncomment to get signed builds:
          #
          #   APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}                    # base64 of Developer ID .p12
          #   APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}  # .p12 export password
          #   APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}          # "Developer ID Application: Name (TEAMID)"
          #   APPLE_ID: ${{ secrets.APPLE_ID }}                                      # Apple ID email
          #   APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}                          # app-specific password
          #   APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}                            # 10-char Team ID
          #   WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}                # base64 of Authenticode .pfx
          #   WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: "Navi ${{ github.ref_name }}"
          releaseBody: |
            Navi — your AI work companion that observes, remembers, and grows with you.

            **macOS (Apple Silicon)**: recommended — `brew install --cask hdusy/navi/navi` (no Gatekeeper prompt, opens directly). Or download `Navi_*_aarch64.dmg`, open it and **double-click `install.command`** — it copies Navi to `/Applications`, clears the quarantine flag (xattr) and launches it, no password needed. If macOS blocks the script itself (unsigned): right-click → **Open**, or on macOS 15+ go to System Settings → **Privacy & Security** → **Open Anyway**.

            **Windows**: download `Navi_*_x64-setup.exe` (NSIS installer, per-user install, no admin needed). Unsigned — on first launch click **More info → Run anyway** to dismiss SmartScreen.
          # 直接发布（非草稿）：下方 Homebrew Cask 步骤需要资产公开 URL
          # 立即可用，`brew install` 才能拉到 dmg。
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }}

      # tauri-action 只上传打包产物（不含 scripts/）。这里把 install.command
      # 注入 macOS DMG（塞到 Navi.app 旁边），再 clobber 覆盖同名资产，
      # 用户打开 DMG 双击 install.command 即可安装并绕过 Gatekeeper。
      # 注意：必须在下方 Homebrew Cask 步骤之前完成——cask 的 sha256
      # 要对最终（注入后）的 dmg 计算。
      - name: Inject install.command into DMG
        if: matrix.os == 'macos-latest'
        run: |
          DMG=$(find apps/desktop/src-tauri/target -name 'Navi_*_aarch64.dmg' -type f | head -n 1)
          bash scripts/patch-dmg.sh "$DMG"
          gh release upload "${{ github.ref_name }}" "$DMG" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 照抄 tokenscope 的 Homebrew Cask 自动更新：release 资产就绪后
      # 下载 dmg 算 sha256，推到 HduSy/homebrew-navi tap 仓库。
      # cask 里 postflight 会清掉隔离标（xattr -cr），brew 用户零弹窗直接打开。
      # 跨仓库推送用 SSH deploy key（只授权 homebrew-navi 单仓库，可随时撤销）。
      - name: Update Homebrew Cask
        if: matrix.os == 'macos-latest'
        env:
          HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          DMG_NAME="Navi_${VERSION}_aarch64.dmg"
          DOWNLOAD_URL="https://github.com/HduSy/navi/releases/download/${GITHUB_REF_NAME}/${DMG_NAME}"

          # 等待注入步骤 clobber 上传的最终资产可下载；-f 保证 404 时不把
          # 错误页当 dmg 去算 sha256。
          SHA256=""
          for i in $(seq 1 10); do
            if curl -fsSL "$DOWNLOAD_URL" -o /tmp/navi.dmg; then
              SHA256=$(shasum -a 256 /tmp/navi.dmg | cut -d' ' -f1)
              break
            fi
            echo "Retry $i: asset not ready yet..."
            sleep 10
          done
          if [ -z "$SHA256" ]; then
            echo "::error::Release asset $DMG_NAME never became available"; exit 1
          fi

          mkdir -p ~/.ssh
          echo "$HOMEBREW_TAP_DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H github.com >> ~/.ssh/known_hosts 2>/dev/null
          git clone git@github.com:HduSy/homebrew-navi.git /tmp/homebrew-tap
          mkdir -p /tmp/homebrew-tap/Casks
          cat > /tmp/homebrew-tap/Casks/navi.rb <<CASK
          cask "navi" do
            version "${VERSION}"
            sha256 "${SHA256}"

            url "${DOWNLOAD_URL}"
            name "Navi"
            desc "AI work companion that observes, remembers, and grows with you"
            homepage "https://github.com/HduSy/navi"

            depends_on macos: ">= :catalina"
            depends_on arch: :arm64

            app "Navi.app"

            # Unsigned/unnotarized build: strip the quarantine flag Homebrew
            # adds so the app opens without the "Apple cannot verify" prompt.
            postflight do
              system_command "/usr/bin/xattr",
                             args: ["-cr", "#{appdir}/Navi.app"],
                             sudo: false
            end
          end
          CASK

          cd /tmp/homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/navi.rb
          git diff --cached --quiet || git commit -m "Update cask to v${VERSION}"
          git push
