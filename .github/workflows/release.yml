name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build + Publish GitHub Release
    # macos-latest = arm64 (Apple Silicon)，与本地产物一致（arm64 dmg/app），
    # 原生编译 rusqlite，无需交叉编译
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 无签名证书：runner 上没有 Developer ID 证书，产物未签名。
      # 之后想签名/公证：在 repo Secrets 配 APPLE_SIGNING_IDENTITY /
      # APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID，tauri-action 会自动签名。
      # 注意：Tauri 没有 electron-builder 的 `--publish` 参数，
      # 建 Release + 传产物由 tauri-action 完成。
      - name: Build + Publish GitHub Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: v__VERSION__
          releaseName: 'Navi v__VERSION__'
          releaseBody: 'See the assets to download this version and install.'
          releaseDraft: true
          prerelease: false
