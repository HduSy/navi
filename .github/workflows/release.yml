name: Release

# Push a version tag (e.g. v0.3.1) to build the app and publish a GitHub Release.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release:
    # Only build/publish for version tags. workflow_dispatch from a branch would
    # otherwise set the version/tag to the branch name and publish a malformed
    # release (e.g. tagged "main").
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    strategy:
      # One platform's failure must not cancel the other — a broken Windows
      # bundler shouldn't block the macOS .dmg from publishing (and vice versa).
      fail-fast: false
      matrix:
        include:
          # macos-latest = arm64 (Apple Silicon)，与本地产物一致（aarch64 dmg/app），
          # 原生编译 rusqlite，无需交叉编译
          - os: macos-latest
            target: aarch64-apple-darwin
            rust-targets: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            rust-targets: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "apps/desktop/src-tauri -> target"

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Build & publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # --- Code signing + notarization (optional) ---
          # UNSIGNED BUILD BY DEFAULT (macOS + Windows). Do NOT set these until
          # the matching secrets actually exist — tauri's bundler treats an empty
          # APPLE_CERTIFICATE env var as "a certificate is present" and then
          # fails on `security import`.
          #
          # Once you have signing credentials, add these in repo
          # Settings → Secrets and uncomment to get signed builds:
          #
          #   APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}                    # base64 of Developer ID .p12
          #   APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}  # .p12 export password
          #   APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}          # "Developer ID Application: Name (TEAMID)"
          #   APPLE_ID: ${{ secrets.APPLE_ID }}                                      # Apple ID email
          #   APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}                          # app-specific password
          #   APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}                            # 10-char Team ID
          #   WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}                # base64 of Authenticode .pfx
          #   WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: "Navi ${{ github.ref_name }}"
          releaseBody: |
            Navi — your AI work companion that observes, remembers, and grows with you.

            **macOS**: download `Navi_*_aarch64.dmg` (Apple Silicon). Unsigned — right-click → **Open** on first launch to dismiss Gatekeeper.

            **Windows**: download `Navi_*_x64-setup.exe` (NSIS installer, per-user install, no admin needed). Unsigned — on first launch click **More info → Run anyway** to dismiss SmartScreen.
          # 保持草稿（draft），不会自动公开。确认无误后到 Release 页面点
          # 「Publish release」，或 `gh release edit ${{ github.ref_name }} --draft=false`。
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}
