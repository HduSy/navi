[package]
name = "navi-desktop"
version = "0.3.5"
description = "Navi — your AI work companion that observes, remembers, and grows with you."
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "fs"] }
chrono = { version = "0.4" }
uuid = { version = "1", features = ["v4"] }
regex = "1"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
dirs = "5"
once_cell = "1"
futures-util = "0.3"
sys-info = "0.9"

[profile.release]
strip = true
lto = true
